name: Exercicio 1 - Build and Publish Flask Image

on:
  push:
    branches:
      - develop2

jobs:
  build_and_publish_flask:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Build Flask-simples
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-simples:alterada ./Curso-CI_com_Docker_e_GitHub_Actions_do_build_ao_deploy_em_nuvem/burguer-app/


      - name: Login - Docker Hub
        uses: docker/login-action@v2
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Push Flask-Simples no Docker
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-simples:alterada


      - name: Validate (Docker Pull) da flas-simples
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/flask-simples:alterada
